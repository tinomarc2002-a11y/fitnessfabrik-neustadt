<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Platzhalter Etage 01, Freihanteln">
  <defs>
    <pattern id="dots01" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="3.6" fill="#F2EEE9" fill-opacity=".085"/>
    </pattern>
    <g id="db01">
      <rect x="300" y="480" width="200" height="40" rx="10"/>
      <rect x="246" y="428" width="56" height="144" rx="12"/>
      <rect x="498" y="428" width="56" height="144" rx="12"/>
      <rect x="188" y="402" width="56" height="196" rx="12"/>
      <rect x="556" y="402" width="56" height="196" rx="12"/>
    </g>
    <filter id="grain01" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="#171412"/>
  <rect width="800" height="1000" fill="url(#dots01)"/>

  <!-- Sticker-Kreis -->
  <circle cx="400" cy="500" r="286" fill="#B04A37" fill-opacity=".2"/>
  <circle cx="400" cy="500" r="286" fill="none" stroke="#B04A37" stroke-width="8" stroke-opacity=".7"/>

  <!-- Hantel mit Farbversatz wie beim Siebdruck -->
  <g transform="rotate(-18 400 500)">
    <use href="#db01" transform="translate(18,18)" fill="#B04A37"/>
    <use href="#db01" fill="#F2EEE9" stroke="#0E0D0C" stroke-width="14" stroke-linejoin="round"/>
  </g>

  <!-- Speedlines -->
  <g stroke="#F2EEE9" stroke-opacity=".42" stroke-width="11" stroke-linecap="round">
    <line x1="96"  y1="226" x2="212" y2="226"/>
    <line x1="142" y1="272" x2="234" y2="272"/>
    <line x1="588" y1="742" x2="704" y2="742"/>
    <line x1="566" y1="788" x2="658" y2="788"/>
  </g>

  <rect x="0" y="946" width="230" height="10" fill="#B04A37"/>
  <text x="740" y="920" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="20"
        font-weight="600" letter-spacing="4" fill="#F2EEE9" fill-opacity=".3">PLATZHALTER</text>

  <rect width="800" height="1000" filter="url(#grain01)" opacity=".06"/>
</svg>
